<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC 多益單字複習工具 - TEST 4</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
        }
        /* 左側選單指定配色 #E0E0E0 */
        .sidebar-bg {
            background-color: #E0E0E0;
        }
        /* 字卡維持白色 */
        .word-card {
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .translation-text {
            transition: all 0.3s ease;
        }
        .hidden-text {
            filter: blur(8px);
            opacity: 0;
            user-select: none;
        }
        /* 選單啟動狀態樣式 */
        .sidebar-item-active {
            background-color: #cbd5e1;
            border-left: 4px solid #6366f1;
            color: #1e293b;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Left Sidebar Menu -->
    <aside class="w-full md:w-64 sidebar-bg text-slate-800 flex-shrink-0 shadow-sm border-r border-slate-300">
        <div class="p-6">
            <h2 class="text-xl font-bold tracking-tight text-slate-900 flex items-center gap-2">
                <span class="bg-indigo-600 p-1.5 rounded">
                    <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                </span>
                多益題庫
            </h2>
        </div>
        <nav class="mt-2 px-3">
            <div class="space-y-1">
                <a href="#" class="sidebar-item-active group flex items-center px-3 py-3 text-sm font-bold rounded-md">
                    <span class="mr-3">📝</span>
                    TEST 4 (目前)
                </a>
                <div class="px-3 py-2 text-xs font-semibold text-slate-500 uppercase tracking-wider mt-6">
                    未來擴充
                </div>
                <a href="#" class="group flex items-center px-3 py-3 text-sm font-medium rounded-md text-slate-500 hover:bg-slate-200 transition">
                    <span class="mr-3">🔒</span>
                    TEST 5
                </a>
                <a href="#" class="group flex items-center px-3 py-3 text-sm font-medium rounded-md text-slate-500 hover:bg-slate-200 transition">
                    <span class="mr-3">🔒</span>
                    TEST 6
                </a>
            </div>
        </nav>
        <div class="mt-auto p-6 text-xs text-slate-400">
            © 2024 TOEIC Study Prep
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto">
        <div class="max-w-4xl mx-auto">
            <!-- Header -->
            <header class="mb-8 text-left border-b border-slate-200 pb-6">
                <div class="flex items-center gap-2 text-indigo-600 font-semibold text-sm mb-1 uppercase tracking-widest">
                    Vocabulary List
                </div>
                <h1 class="text-4xl font-extrabold text-slate-800 mb-2">TEST 4 多益單字複習</h1>
            </header>

            <!-- Controls -->
            <div class="bg-white p-4 rounded-xl shadow-sm mb-6 flex flex-wrap gap-4 items-center justify-between sticky top-4 z-10 border border-slate-200">
                <div class="flex flex-wrap gap-2">
                    <button onclick="toggleAll(true)" class="px-4 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 font-semibold text-sm transition shadow-sm">顯示全部</button>
                    <button onclick="toggleAll(false)" class="px-4 py-2 bg-slate-200 text-slate-700 rounded-lg hover:bg-slate-300 font-semibold text-sm transition">全部隱藏</button>
                    <div class="h-8 w-px bg-slate-200 mx-1 hidden sm:block"></div>
                    <button onclick="shuffleWords()" class="px-4 py-2 border border-indigo-200 text-indigo-600 rounded-lg hover:bg-indigo-50 font-semibold text-sm transition">隨機排序</button>
                    <button onclick="resetOrder()" class="px-4 py-2 border border-slate-300 text-slate-600 rounded-lg hover:bg-slate-50 font-semibold text-sm transition">恢復順序</button>
                </div>
                <div class="relative flex-grow max-w-xs w-full md:w-auto">
                    <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                        <svg class="h-4 w-4 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                    <input type="text" id="searchInput" oninput="filterWords()" placeholder="搜尋單字或詞性..." class="w-full pl-10 pr-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none transition">
                </div>
            </div>

            <!-- Word List -->
            <div id="wordList" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Cards injected here -->
            </div>
        </div>
    </main>

    <script>
        const originalVocabulary = [
            { word: "institute", trans: "(n.) 機構" },
            { word: "dental coverage", trans: "(n. phr.) 牙醫保險" },
            { word: "entrepreneurs", trans: "(n.) 企業家" },
            { word: "minority", trans: "(n.) 少數" },
            { word: "cultivate", trans: "(v.) 培養, 栽培" },
            { word: "acceptance", trans: "(n.) 接受" },
            { word: "executive", trans: "(adj.) 行政的, (n.) 行政人員" },
            { word: "as opposed to", trans: "(phr.) 與~相反" },
            { word: "architect", trans: "(n.) 建築師" },
            { word: "deduct", trans: "(v.) 扣除" },
            { word: "substitute", trans: "(v./n.) 取代, 代替" },
            { word: "upturn", trans: "(n.) 好轉" },
            { word: "As a result of", trans: "(phr.) 由於..." },
            { word: "provided that", trans: "(conj.) 儘管 / 只要" },
            { word: "deposit", trans: "(v./n.) 存放 / 押金" },
            { word: "renowned", trans: "(adj.) 著名的" },
            { word: "retrieve", trans: "(v.) 取回, 恢復" },
            { word: "patron", trans: "(n.) 老主顧" },
            { word: "pension plan", trans: "(n. phr.) 退休金方案" },
            { word: "substantial", trans: "(adj.) 可觀的" },
            { word: "grant", trans: "(n.) 獎學金" },
            { word: "scheme", trans: "(n.) 計畫" },
            { word: "malfunction", trans: "(n./v.) 故障, 機能失常" },
            { word: "impractical", trans: "(adj.) 不切實際的" },
            { word: "costly", trans: "(adj.) 昂貴的, 代價高的" },
            { word: "stop by", trans: "(v. phr.) 順道拜訪" },
            { word: "pertaining to", trans: "(phr.) 與~有關" },
            { word: "ever since", trans: "(adv.) 從此以後" },
            { word: "exist", trans: "(v.) 生存" },
            { word: "unveil", trans: "(v.) 揭開" },
            { word: "resume", trans: "(v.) 重啟" },
            { word: "surcharge", trans: "(n./v.) 附加費, 收取附加費用" },
            { word: "inauguration", trans: "(n.) 開幕式, 落成典禮" },
            { word: "sought after", trans: "(adj. phr.) 受歡迎的" },
            { word: "stand out", trans: "(v. phr.) 出類拔萃" },
            { word: "fame", trans: "(n.) 名望" },
            { word: "duplicate", trans: "(adj./v.) 複製的, 重複" },
            { word: "diligent", trans: "(adj.) 勤勉的" },
            { word: "long-lasting", trans: "(adj.) 持久的, 長效的" },
            { word: "enrollee", trans: "(n.) 入學者, 新進者" },
            { word: "existing", trans: "(adj.) 現存的, 現行的" },
            { word: "criteria", trans: "(n.) 標準" },
            { word: "consecutive", trans: "(adj.) 連續的" },
            { word: "remote", trans: "(adj.) 遠程的" },
            { word: "cordially", trans: "(adv.) 誠摯地" },
            { word: "exposition", trans: "(n.) 博覽會" },
            { word: "recipient", trans: "(n.) 接受者" },
            { word: "restoration", trans: "(n.) 修復" },
            { word: "planetarium", trans: "(n.) 天文館" },
            { word: "auxiliary", trans: "(adj.) 輔助的" },
            { word: "dairy", trans: "(n.) 乳製品" },
            { word: "shelf", trans: "(n.) 架子" },
            { word: "guidance", trans: "(n.) 指導" },
            { word: "guardian", trans: "(n.) 監護人" },
            { word: "entrant", trans: "(n.) 參賽者" },
            { word: "contestant", trans: "(n.) 參賽者" },
            { word: "furnish", trans: "(v.) 佈置, 提供" },
            { word: "calendar", trans: "(n.) 日曆" },
            { word: "border", trans: "(n.) 邊界" },
            { word: "rush", trans: "(v.) 趕快去做" },
            { word: "joint", trans: "(n.) 關節" },
            { word: "sprain", trans: "(v./n.) 扭傷" },
            { word: "sprinter", trans: "(n.) 短跑選手" },
            { word: "patronage", trans: "(n.) 贊助 / 光顧" },
            { word: "ingest", trans: "(v.) 攝取, 嚥下" },
            { word: "regimen", trans: "(n.) 療程" },
            { word: "physician", trans: "(n.) 醫師" },
            { word: "diabetic", trans: "(n.) 糖尿病患者" },
            { word: "rot", trans: "(v.) 腐敗" },
            { word: "a handful of", trans: "(phr.) 少數的" },
            { word: "orchard", trans: "(n.) 果園" },
            { word: "pitch", trans: "(v./n.) 投擲" },
            { word: "contractor", trans: "(n.) 承包商" },
            { word: "wire", trans: "(n.) 電線" },
            { word: "as per", trans: "(phr.) 按照/根據" },
            { word: "forum", trans: "(n.) 論壇, 討論會" },
            { word: "pedestrian", trans: "(n.) 行人" },
            { word: "worn", trans: "(adj.) 磨損的" },
            { word: "laminate", trans: "(n.) 層壓板" },
            { word: "granite", trans: "(n.) 花崗岩" },
            { word: "marble", trans: "(n.) 大理石" },
            { word: "leaflet", trans: "(n.) 傳單" },
            { word: "piece", trans: "(n.) 件/個/塊" },
            { word: "cutlery", trans: "(n.) 餐具" },
            { word: "join forces with", trans: "(v. phr.) 合作" },
            { word: "press statement", trans: "(n. phr.) 新聞聲明" },
            { word: "gathering", trans: "(n.) 集會" },
            { word: "occasion", trans: "(n.) 場合" },
            { word: "an assortment of", trans: "(phr.) 各式樣的" },
            { word: "appetizer", trans: "(n.) 開胃菜" }
        ];

        let currentData = [...originalVocabulary];

        function speakWord(word) {
            // Check if the browser supports SpeechSynthesis
            if ('speechSynthesis' in window) {
                // Cancel any ongoing speech
                window.speechSynthesis.cancel();
                
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US'; // Set language to US English
                utterance.rate = 0.9;     // Slightly slower for better clarity
                
                // Select a preferred voice if available (e.g., Google US English)
                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(voice => voice.name.includes('Google US English') || voice.name.includes('English (United States)'));
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                console.warn('Text-to-Speech is not supported in this browser.');
            }
        }

        function renderWords() {
            const listElement = document.getElementById('wordList');
            listElement.innerHTML = '';
            
            currentData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "word-card p-5 rounded-xl border border-slate-200 flex justify-between items-center group shadow-sm";
                card.innerHTML = `
                    <div class="flex-grow">
                        <h3 class="text-lg font-semibold text-slate-900">${item.word}</h3>
                        <div class="mt-1 h-6 overflow-hidden">
                            <p id="trans-${index}" class="translation-text text-indigo-700 font-bold hidden-text">
                                ${item.trans}
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 ml-4">
                        <button onclick="speakWord('${item.word.replace(/'/g, "\\'")}')" class="p-2 text-xs bg-slate-50 hover:bg-indigo-100 text-indigo-600 rounded-lg border border-slate-200 transition-all uppercase tracking-wider font-bold shadow-sm flex items-center justify-center gap-1" title="聽發音">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                            發音
                        </button>
                        <button onclick="toggleSingle(${index})" class="p-2 text-xs bg-slate-50 hover:bg-indigo-600 hover:text-white text-slate-500 rounded-lg border border-slate-200 transition-all uppercase tracking-wider font-bold shadow-sm">
                            顯示翻譯
                        </button>
                    </div>
                `;
                listElement.appendChild(card);
            });
        }

        // Some browsers load voices asynchronously, this ensures they are available
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                // Just to trigger loading
                window.speechSynthesis.getVoices();
            };
        }

        function toggleSingle(index) {
            document.getElementById(`trans-${index}`).classList.toggle('hidden-text');
        }

        function toggleAll(show) {
            document.querySelectorAll('.translation-text').forEach(el => {
                show ? el.classList.remove('hidden-text') : el.classList.add('hidden-text');
            });
        }

        function shuffleWords() {
            currentData.sort(() => Math.random() - 0.5);
            renderWords();
        }

        function resetOrder() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = term ? 
                originalVocabulary.filter(i => i.word.toLowerCase().includes(term) || i.trans.toLowerCase().includes(term)) : 
                [...originalVocabulary];
            renderWords();
        }

        function filterWords() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = originalVocabulary.filter(i => 
                i.word.toLowerCase().includes(term) || i.trans.toLowerCase().includes(term)
            );
            renderWords();
        }

        renderWords();
    </script>
</body>
</html>
