<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC 多益單字學習與測驗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f1f5f9;
        }
        /* 左側選單指定配色 #E0E0E0 */
        .sidebar-bg {
            background-color: #E0E0E0;
        }
        /* 字卡與測驗卡片維持白色 */
        .word-card, .quiz-card {
            background-color: #ffffff;
            transition: all 0.2s ease;
        }
        .word-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1);
        }
        .translation-text {
            transition: all 0.3s ease;
        }
        .hidden-text {
            filter: blur(8px);
            opacity: 0;
            user-select: none;
        }
        /* 選單啟動狀態樣式 (複習模式 - 靛藍色) */
        .sidebar-item-active-review {
            background-color: #cbd5e1;
            border-left: 4px solid #6366f1;
            color: #1e293b;
        }
        /* 選單啟動狀態樣式 (測驗模式 - 藍色) */
        .sidebar-item-active-quiz {
            background-color: #cbd5e1;
            border-left: 4px solid #3b82f6; /* Blue-500 */
            color: #1e293b;
        }
        /* 測驗選項按鈕特效 */
        .quiz-option {
            transition: all 0.15s ease-in-out;
        }
        .quiz-option:hover:not(:disabled) {
            transform: scale(1.01);
            background-color: #f8fafc;
            border-color: #94a3b8;
        }
        .quiz-option:active:not(:disabled) {
            transform: scale(0.99);
        }
        .quiz-option.correct {
            background-color: #dcfce7 !important; /* green-100 */
            border-color: #22c55e !important; /* green-500 */
            color: #166534 !important; /* green-800 */
            pointer-events: none;
        }
        .quiz-option.wrong {
            background-color: #fee2e2 !important; /* red-100 */
            border-color: #ef4444 !important; /* red-500 */
            color: #991b1b !important; /* red-800 */
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col md:flex-row min-h-screen">

    <!-- Main Content -->

    <script>
        // --- 核心資料 ---
        const originalVocabulary = [

            { word: "piece", trans: "(n.) 張/件/塊" },
            { word: "cutlery", trans: "(n.) 餐具" },
            { word: "join forces with", trans: "(v. phr.) 合作" },
            { word: "press statement", trans: "(n. phr.) 新聞聲明" },

            { word: "occasion", trans: "(n.) 場合" },
            { word: "an assortment of", trans: "(phr.) 各式各樣的" },
            { word: "appetizer", trans: "(n.) 開胃菜" }
        ];

        // --- 全域與發音設定 ---
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        function speakWord(word) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                const voices = window.speechSynthesis.getVoices();
                const preferredVoice = voices.find(v => v.name.includes('Google US English') || v.name.includes('English (United States)'));
                if (preferredVoice) utterance.voice = preferredVoice;
                window.speechSynthesis.speak(utterance);
            }
        }

        // --- 模式切換邏輯 ---
        function switchMode(mode, testName) {
            const reviewBtn = document.getElementById('nav-review-test4');
            const quizBtn = document.getElementById('nav-quiz-test4');
            const reviewContainer = document.getElementById('review-mode-container');
            const quizContainer = document.getElementById('quiz-mode-container');

            if (mode === 'review') {
                // UI 切換
                reviewBtn.className = "sidebar-item-active-review w-full text-left group flex items-center px-3 py-3 text-sm font-bold rounded-md transition-colors";
                quizBtn.className = "w-full text-left group flex items-center px-3 py-3 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-200 transition-colors";
                
                reviewContainer.classList.remove('hidden');
                reviewContainer.classList.add('block');
                quizContainer.classList.remove('block');
                quizContainer.classList.add('hidden');
            } else if (mode === 'quiz') {
                // UI 切換
                quizBtn.className = "sidebar-item-active-quiz w-full text-left group flex items-center px-3 py-3 text-sm font-bold rounded-md transition-colors";
                reviewBtn.className = "w-full text-left group flex items-center px-3 py-3 text-sm font-medium rounded-md text-slate-600 hover:bg-slate-200 transition-colors";
                
                reviewContainer.classList.remove('block');
                reviewContainer.classList.add('hidden');
                quizContainer.classList.remove('hidden');
                quizContainer.classList.add('block');
                
                // 進入測驗模式自動開始新的一局
                startQuiz();
            }
        }

        // ====== 模式 1：複習模式功能 ======
        let currentData = [...originalVocabulary];

        function renderWords() {
            const listElement = document.getElementById('wordList');
            listElement.innerHTML = '';
            
            currentData.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "word-card p-5 rounded-xl border border-slate-200 flex justify-between items-center group shadow-sm";
                card.innerHTML = `
                    <div class="flex-grow">
                        <h3 class="text-lg font-semibold text-slate-900">${item.word}</h3>
                        <div class="mt-1 h-6 overflow-hidden">
                            <p id="trans-${index}" class="translation-text text-indigo-700 font-bold hidden-text text-sm">
                                ${item.trans}
                            </p>
                        </div>
                    </div>
                    <div class="flex flex-col gap-2 ml-4">
                        <button onclick="speakWord('${item.word.replace(/'/g, "\\'")}')" class="p-2 text-xs bg-slate-50 hover:bg-indigo-100 text-indigo-600 rounded-lg border border-slate-200 transition-all uppercase tracking-wider font-bold shadow-sm flex items-center justify-center gap-1" title="聽發音">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                            發音
                        </button>
                        <button onclick="toggleSingle(${index})" class="p-2 text-xs bg-slate-50 hover:bg-indigo-600 hover:text-white text-slate-500 rounded-lg border border-slate-200 transition-all uppercase tracking-wider font-bold shadow-sm">
                            顯示翻譯
                        </button>
                    </div>
                `;
                listElement.appendChild(card);
            });
        }

        function toggleSingle(index) { document.getElementById(`trans-${index}`).classList.toggle('hidden-text'); }
        function toggleAll(show) { document.querySelectorAll('.translation-text').forEach(el => show ? el.classList.remove('hidden-text') : el.classList.add('hidden-text')); }
        function shuffleWords() { currentData.sort(() => Math.random() - 0.5); renderWords(); }
        function resetOrder() { 
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = term ? originalVocabulary.filter(i => i.word.toLowerCase().includes(term) || i.trans.toLowerCase().includes(term)) : [...originalVocabulary];
            renderWords(); 
        }
        function filterWords() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            currentData = originalVocabulary.filter(i => i.word.toLowerCase().includes(term) || i.trans.toLowerCase().includes(term));
            renderWords();
        }

        // 初始化複習模式
        renderWords();

        // ====== 模式 2：測驗小遊戲功能 ======
        let quizQueue = [];
        let currentQuizIndex = 0;
        let score = 0;
        let wrongAnswers = []; // 紀錄錯題 [{word: '...', trans: '...', userChoice: '...'}]
        let isAnswered = false;

        function startQuiz() {
            // 重設狀態
            quizQueue = [...originalVocabulary].sort(() => Math.random() - 0.5); // 打亂題庫
            currentQuizIndex = 0;
            score = 0;
            wrongAnswers = [];
            isAnswered = false;

            // 切換 UI 顯示區塊
            document.getElementById('quiz-result-area').classList.add('hidden');
            document.getElementById('quiz-active-area').classList.remove('hidden');
            document.getElementById('wrong-answers-container').classList.add('hidden');
            
            document.getElementById('quiz-total-score').innerText = quizQueue.length;

            loadNextQuestion();
        }

        function loadNextQuestion() {
            if (currentQuizIndex >= quizQueue.length) {
                showQuizResult();
                return;
            }

            isAnswered = false;
            const currentItem = quizQueue[currentQuizIndex];
            
            // 更新進度與題目
            document.getElementById('quiz-progress-text').innerText = `${currentQuizIndex + 1} / ${quizQueue.length}`;
            document.getElementById('quiz-progress-bar').style.width = `${((currentQuizIndex) / quizQueue.length) * 100}%`;
            document.getElementById('quiz-question-word').innerText = currentItem.word;
            
            // 產生 4 個選項 (1 正確, 3 隨機錯誤)
            let options = [currentItem];
            let pool = originalVocabulary.filter(v => v.word !== currentItem.word);
            pool.sort(() => Math.random() - 0.5); // 打亂備選池
            options.push(pool[0], pool[1], pool[2]); // 取前三個當干擾選項
            options.sort(() => Math.random() - 0.5); // 將四個選項打亂

            const optionsGrid = document.getElementById('quiz-options-grid');
            optionsGrid.innerHTML = ''; // 清空舊選項

            options.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = "quiz-option w-full p-4 md:p-5 text-left border-2 border-slate-200 rounded-xl font-semibold text-slate-700 bg-white shadow-sm hover:shadow-md text-base md:text-lg focus:outline-none";
                btn.innerText = opt.trans;
                btn.onclick = () => handleAnswer(opt, currentItem, btn, optionsGrid);
                optionsGrid.appendChild(btn);
            });
        }

        function speakCurrentQuizWord() {
            const word = document.getElementById('quiz-question-word').innerText;
            speakWord(word);
        }

        function handleAnswer(selectedItem, correctItem, clickedBtn, gridElement) {
            if (isAnswered) return; // 避免重複點擊
            isAnswered = true;

            const buttons = gridElement.querySelectorAll('button');
            
            if (selectedItem.word === correctItem.word) {
                // 答對
                clickedBtn.classList.add('correct');
                score++;
            } else {
                // 答錯
                clickedBtn.classList.add('wrong');
                // 找出正確的按鈕並標示為綠色
                buttons.forEach(btn => {
                    if (btn.innerText === correctItem.trans) {
                        btn.classList.add('correct');
                    }
                });
                // 紀錄錯題
                wrongAnswers.push({
                    word: correctItem.word,
                    trans: correctItem.trans,
                    userChoice: selectedItem.trans
                });
            }

            // 停頓 1.2 秒後進入下一題
            setTimeout(() => {
                currentQuizIndex++;
                loadNextQuestion();
            }, 1200);
        }

        function showQuizResult() {
            document.getElementById('quiz-active-area').classList.add('hidden');
            const resultArea = document.getElementById('quiz-result-area');
            resultArea.classList.remove('hidden');

            // 滿分進度條
            document.getElementById('quiz-progress-bar').style.width = `100%`;
            document.getElementById('quiz-score').innerText = score;

            // 處理錯題清單
            const wrongContainer = document.getElementById('wrong-answers-container');
            const wrongList = document.getElementById('wrong-answers-list');
            wrongList.innerHTML = '';

            if (wrongAnswers.length > 0) {
                wrongContainer.classList.remove('hidden');
                wrongAnswers.forEach(err => {
                    const el = document.createElement('div');
                    el.className = "bg-white p-4 rounded-xl border border-red-200 shadow-sm flex flex-col items-start";
                    el.innerHTML = `
                        <div class="flex items-center gap-2 mb-1 w-full justify-between">
                            <span class="text-lg font-bold text-slate-900">${err.word}</span>
                            <button onclick="speakWord('${err.word.replace(/'/g, "\\'")}')" class="text-slate-400 hover:text-blue-500">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"></path></svg>
                            </button>
                        </div>
                        <div class="text-sm">
                            <span class="text-green-600 font-bold flex items-center gap-1 mb-1">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                                ${err.trans}
                            </span>
                            <span class="text-red-400 text-xs line-through ml-5">
                                您選了：${err.userChoice}
                            </span>
                        </div>
                    `;
                    wrongList.appendChild(el);
                });
            } else {
                wrongContainer.classList.add('hidden');
                // 滿分特效可以加在這裡
            }
        }

    </script>
</body>
</html>
